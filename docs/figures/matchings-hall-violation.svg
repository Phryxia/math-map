<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <rect x="0" y="0" width="300" height="220" fill="#ffffff"/>
  <g stroke="#999999" stroke-width="1.5">
    <line x1="60" y1="40" x2="240" y2="110"/>
    <line x1="60" y1="110" x2="240" y2="40"/>
    <line x1="60" y1="180" x2="240" y2="40"/>
    <line x1="60" y1="180" x2="240" y2="110"/>
  </g>
  <g stroke="#000000" stroke-width="4">
    <line x1="60" y1="40" x2="240" y2="40"/>
    <line x1="60" y1="110" x2="240" y2="110"/>
  </g>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="60" cy="40" r="16"/>
    <circle cx="60" cy="110" r="16"/>
    <circle cx="60" cy="180" r="16"/>
    <circle cx="240" cy="40" r="16"/>
    <circle cx="240" cy="110" r="16"/>
    <circle cx="240" cy="180" r="16"/>
  </g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#000000">
    <text x="60" y="40">x1</text>
    <text x="60" y="110">x2</text>
    <text x="60" y="180">x3</text>
    <text x="240" y="40">y1</text>
    <text x="240" y="110">y2</text>
    <text x="240" y="180">y3</text>
  </g>
</svg>
