<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <rect x="0" y="0" width="360" height="200" fill="#ffffff"/>
  <g stroke="#333333" stroke-width="2">
    <line x1="50" y1="50" x2="50" y2="150"/>
    <line x1="50" y1="50" x2="140" y2="100"/>
    <line x1="50" y1="150" x2="140" y2="100"/>
    <line x1="140" y1="100" x2="230" y2="100"/>
    <line x1="230" y1="100" x2="320" y2="100"/>
  </g>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="50" cy="50" r="16"/>
    <circle cx="50" cy="150" r="16"/>
    <circle cx="140" cy="100" r="16"/>
    <circle cx="230" cy="100" r="16"/>
    <circle cx="320" cy="100" r="16"/>
  </g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">
    <text x="50" y="50">1</text>
    <text x="50" y="150">2</text>
    <text x="140" y="100">3</text>
    <text x="230" y="100">4</text>
    <text x="320" y="100">5</text>
  </g>
</svg>
