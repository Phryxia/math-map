<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <rect x="0" y="0" width="400" height="320" fill="#ffffff"/>
  <g stroke="#333333" stroke-width="2">
    <line x1="200" y1="30" x2="110" y2="90"/>
    <line x1="200" y1="30" x2="290" y2="90"/>
    <line x1="110" y1="90" x2="110" y2="150"/>
    <line x1="110" y1="150" x2="110" y2="210"/>
    <line x1="110" y1="210" x2="110" y2="270"/>
    <line x1="290" y1="90" x2="290" y2="150"/>
    <line x1="290" y1="150" x2="290" y2="210"/>
    <line x1="290" y1="210" x2="290" y2="270"/>
  </g>
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="200" cy="30" r="16"/>
    <circle cx="110" cy="90" r="16"/>
    <circle cx="110" cy="150" r="16"/>
    <circle cx="110" cy="210" r="16"/>
    <circle cx="290" cy="90" r="16"/>
    <circle cx="290" cy="150" r="16"/>
    <circle cx="290" cy="210" r="16"/>
    <circle cx="290" cy="270" r="16" stroke-dasharray="4 3"/>
  </g>
  <circle cx="110" cy="270" r="16" fill="#333333" stroke="#333333" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#000000">
    <text x="200" y="30">a</text>
    <text x="110" y="90">b</text>
    <text x="110" y="150">c</text>
    <text x="110" y="210">d</text>
    <text x="110" y="270" fill="#ffffff">a</text>
    <text x="290" y="90">d</text>
    <text x="290" y="150">c</text>
    <text x="290" y="210">b</text>
    <text x="290" y="270">a</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#555555" dominant-baseline="central">
    <text x="140" y="270">채움</text>
    <text x="320" y="270">비움</text>
  </g>
</svg>
