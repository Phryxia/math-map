<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230">
  <rect x="0" y="0" width="640" height="230" fill="#ffffff"/>
  <line x1="60" y1="110" x2="160" y2="40" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="60" y1="110" x2="160" y2="180" stroke="#333333" stroke-width="3"/>
  <line x1="160" y1="40" x2="160" y2="180" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="160" y1="40" x2="260" y2="110" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="160" y1="180" x2="260" y2="110" stroke="#333333" stroke-width="3"/>
  <circle cx="60" cy="110" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="60" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">1</text>
  <circle cx="160" cy="40" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="160" y="40" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">2</text>
  <circle cx="160" cy="180" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="160" y="180" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">3</text>
  <circle cx="260" cy="110" r="18" fill="#dddddd" stroke="#333333" stroke-width="2"/>
  <text x="260" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">4</text>
  <text x="160" y="215" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">1→2→1→3→4 에서 고리를 지움</text>
  <line x1="380" y1="110" x2="480" y2="40" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="380" y1="110" x2="480" y2="180" stroke="#333333" stroke-width="3"/>
  <line x1="480" y1="40" x2="480" y2="180" stroke="#333333" stroke-width="3"/>
  <line x1="480" y1="40" x2="580" y2="110" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="480" y1="180" x2="580" y2="110" stroke="#333333" stroke-width="3"/>
  <circle cx="380" cy="110" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="380" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">1</text>
  <circle cx="480" cy="40" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="480" y="40" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">2</text>
  <circle cx="480" cy="180" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="480" y="180" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">3</text>
  <circle cx="580" cy="110" r="18" fill="#dddddd" stroke="#333333" stroke-width="2"/>
  <text x="580" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#000000">4</text>
  <text x="480" y="215" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">2→3 에서 멈춤</text>
</svg>
